{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h1>You have logged in successfully!</h1>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-grid">
        <button type="submit" class="btn btn-primary mt-3">Save changes</button>
    </div>
</form>
{% endblock %}
