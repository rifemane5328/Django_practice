{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">Login</h2>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">Увійти</button>
  </form>

  <p class="mt-3">
    Ще не маєте акаунта? <a href="{% url 'auth:register' %}">Зареєструватися тут</a>
  </p>
  
  <a href="https://127.0.0.1:8000/api/auth/google/login">Авторизація через Google</a>
</div>
{% endblock %}
